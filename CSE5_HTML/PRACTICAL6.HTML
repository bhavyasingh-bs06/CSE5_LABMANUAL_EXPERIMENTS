<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1 style="text-align: center;">Student Registration Form</H1>
    <hr>
    <form>
        <div>
            <lable for="name"> Full Name:</lable>
            <input type="text" name="name" placeholder="Enter your full name" REQUIRED><BR><BR>
            
        </div>
        <DIV>
            <LABLE FOR="EMAIL">EMAIL:</LABLE>
            <INPUT TYPE="EMAIL" NAME="EMAIL" PLACEHOLDER="Enter valid email address" REQUIRED><br><br>
        </DIV>
        <DIV>
            <LABLE FOR="PASSWORD">PASSWORD:</LABLE>
            <INPUT TYPE="PASSWORD" NAME="PASSWORD" PLACEHOLDER="Enter your password" REQUIRED><br><br>
        </DIV>
        <DIV>
            <lable for="gender">Gender:</lable>&nbsp&nbsp
            <INPUT TYPE="RADIO" NAME="Male" Value="Male" REQUIRED>Male
            <INPUT TYPE="RADIO" NAME="Female" Value="Female" REQUIRED>Female
            <input type="radio" name="Other" Value="Other" REQUIRED>other<br><br>
        

        </DIV>
        <div>
            <lable for="course">Course:</lable>
            <select name="course" required>
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="B.Tech">B.Tech</option>
                <option value="MCA">MCA</option>
                <OPTION VALUE="MBA">MBA</OPTION>
            </select><br><br>
        </div>
        <DIV>
            <LABLE FOR="PHONE">Contact Number:</LABLE>
            <input type="tel" name="phone" placeholder="Enter your contact number" required><br><br>

        </DIV>
        <div>
            <lable for="address">Address:</lable><br>
            <textarea name="address" height="1000" placeholder="Enter your address" required></textarea><br><br>
        </div>
        <div>
            <input type="submit" value="Register">&nbsp&nbsp
            <input type="reset" value="Clear">
    </form>
    <hr>
    <p style="text-align: center;">&copy; 2026 Student Registration Portal</p>
    
</body>
</html>
